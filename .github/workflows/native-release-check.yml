name: Native stable release verification and README sync

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to verify before publishing
        required: true
        type: string
  release:
    types: [published, released]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: native-stable-release-sync
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check whether the published release is Latest
        if: github.event_name == 'release'
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$REQUESTED_TAG" ]]; then
            echo "This release is not Latest; no README update is needed." >> "$GITHUB_STEP_SUMMARY"
            echo 'SKIP_SYNC=1' >> "$GITHUB_ENV"
          fi
      - name: Check release synchronization safeguards
        if: env.SKIP_SYNC != '1'
        run: python3 script/test_sync_stable_release.py
      - name: Verify release assets, signatures, version and localizations
        if: env.SKIP_SYNC != '1'
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 script/sync_stable_release.py --tag "$REQUESTED_TAG"
          else
            python3 script/sync_stable_release.py --tag "$REQUESTED_TAG" --write
          fi
      - name: Commit and push stable README changes
        if: github.event_name == 'release' && env.SKIP_SYNC != '1'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "README files already match $REQUESTED_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$REQUESTED_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md
          git commit -m "docs: sync stable release $REQUESTED_TAG"
          if git push origin HEAD:main; then
            echo "Synchronized both README files to $REQUESTED_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main advanced during synchronization. Rerun this workflow." >&2
            exit 1
          fi
          branch="automation/stable-readme-${REQUESTED_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "docs: sync stable release $REQUESTED_TAG" \
            --body "Synchronizes the English and Chinese stable download blocks after release asset, signature, version and localization checks."
          echo "Direct push was rejected; opened a pull request for $REQUESTED_TAG." >> "$GITHUB_STEP_SUMMARY"
