name: 联机问题 / Multiplayer
description: 游戏已打开后的匹配、加入或断线问题 / Matching, joining or disconnects after game startup
title: '[Multiplayer] '
body:
- type: markdown
  attributes:
    value: |-
      当前是源码技术预览，完整安装包尚未提供。/ This is a source technical preview; a complete installer is not available.

      仅提供最少量已脱敏信息。不要上传密码、令牌、SSH 密钥、Steam 账号、IP 地址、代理节点/订阅、个人配置、完整日志或虚拟机磁盘。/ Share minimal redacted details only. Do not attach credentials, account details, addresses, proxy nodes/subscriptions, personal settings, full logs or VM disks.
- type: textarea
  id: environment
  attributes:
    label: 环境 / Environment
    description: 不知道的项目写 unknown；不要写序列号、账号或个人路径。/ Use unknown where needed; omit serial numbers, accounts
      and personal paths.
    placeholder: |-
      Mac chip + memory category / 芯片与内存档位:
      macOS version / 系统版本:
      Launcher commit or download date / 启动器提交或下载日期:
      FX, FEX, Proton versions (if known) / 版本（如知道）:
  validations:
    required: true
- type: dropdown
  id: network_category
  attributes:
    label: 网络类别 / Network category
    description: 只选类别，不提供地址、节点名或订阅。/ Category only; no addresses, node names or subscriptions.
    options:
    - 直连 / Direct
    - 系统 TUN / System TUN
    - 显式代理 / Explicit proxy
    - 其他或不知道 / Other or unknown
  validations:
    required: true
- type: dropdown
  id: action
  attributes:
    label: 发生在哪个操作？ / Which action?
    options:
    - 快速匹配 / Quickplay
    - 加入他人 / Join another player
    - 他人加入 / Others joining
    - 对局中断线 / In-session disconnect
    - 其他 / Other
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: 复现步骤 / Steps to reproduce
    description: 从下载或进入菜单开始，写出最短步骤。/ List the shortest steps from download or the menu.
  validations:
    required: true
- type: textarea
  id: result
  attributes:
    label: 预期与实际结果 / Expected and actual result
    description: 错误只贴最少量已脱敏文字；无需完整日志。/ Include only minimal redacted error text; full logs are not needed.
  validations:
    required: true
- type: textarea
  id: observations
  attributes:
    label: 观察范围 / Observation scope
    description: 区分游戏启动、EAC 状态和联机结果；写观察时长及明确结果次数，不把点击次数当作失败次数。不要为反馈擅自改网络或增加探测。/ Separate startup, EAC
      and multiplayer outcomes; include observation time and clear results, not click counts. No network
      changes or extra probes are required.
  validations:
    required: true
- type: checkboxes
  id: privacy
  attributes:
    label: 信息检查 / Privacy check
    options:
    - label: 我已检查内容和附件，移除了凭据与个人信息。/ I checked the text and attachments and removed credentials and personal
        information.
      required: true
